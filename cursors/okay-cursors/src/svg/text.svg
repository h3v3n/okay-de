<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">

  <defs>
    <linearGradient id="darkGlass" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#131C2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>
    <linearGradient id="anodizedRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.48)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(148,163,184,0.28)"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.55)"/>
      <stop offset="65%" stop-color="rgba(16,185,129,0.14)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.85"/>
      <feOffset dx="0.45" dy="0.95" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.58"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M 8.2 4.2 L 15.8 4.2 L 15.8 6.1 L 13.05 6.4 L 13.05 17.6 L 15.8 17.9 L 15.8 19.8 L 8.2 19.8 L 8.2 17.9 L 10.95 17.6 L 10.95 6.4 L 8.2 6.1 Z" fill="url(#darkGlass)" stroke="rgba(255,255,255,0.32)" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M 8.2 4.2 L 15.8 4.2 L 15.8 6.1 L 13.05 6.4 L 13.05 17.6 L 15.8 17.9 L 15.8 19.8 L 8.2 19.8 L 8.2 17.9 L 10.95 17.6 L 10.95 6.4 L 8.2 6.1 Z" fill="url(#glassSheen)" stroke="url(#anodizedRim)" stroke-width="0.45" stroke-linejoin="round"/>
    <rect x="11.35" y="6.8" width="1.3" height="10.4" rx="0.65" fill="rgba(226,232,240,0.45)"/>
    <rect x="10.3" y="11.35" width="3.4" height="1.3" rx="0.65" fill="url(#emeraldGrad)"/>
    <circle cx="12" cy="12" r="2.2" fill="url(#emeraldGlow)"/>
