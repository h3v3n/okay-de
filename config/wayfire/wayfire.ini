# OKay DE - Konfiguracja kompozytora Wayfire (Catppuccin Mocha)

[core]
plugins = alpha animate autostart command decoration foreign-toplevel gtk-shell grid idle move place resize switcher vswitch window-rules wm-actions xdg-activation
vwidth = 2
vheight = 1
preferred_decoration_mode = server
close_top_view = <super> KEY_Q | <alt> KEY_F4
xwayland = true

[input]
xkb_layout = pl
tap_to_click = true
natural_scroll = false
disable_while_typing = true
mouse_cursor_speed = 0.0
touchpad_cursor_speed = 0.0
left_handed_mode = false
cursor_theme = Adwaita
cursor_size = 24

[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = squeezimize
duration = 220
zoom_duration = 220
fade_duration = 180
squeezimize_duration = 250
startup_duration = 250
fade_enabled_for = (type is "overlay" | (type is "x-or" & focusable is true))

[decoration]
font = JetBrains Mono
title_height = 28
border_size = 2
button_order = minimize maximize close
active_color = 0.0000 0.9020 0.4627 1.0000
inactive_color = 0.1922 0.1961 0.2667 1.0000
ignore_views = app_id is "okay-panel" | app_id is "okay-desktop" | app_id is "okay-menu" | app_id is "okay-powermenu" | app_id is "okay-clipboard"

[pixdecor]
titlebar = true
csd_titlebar_height = 28
border_size = 2
rounded_corner_radius = 8
overlay_engine = rounded_corners
always_decorate = all
fg_color = 0.0000 0.9020 0.4627 1.0000
bg_color = 0.1176 0.1176 0.1804 1.0000
fg_text_color = 0.0667 0.0667 0.1059 1.0000
bg_text_color = 0.6510 0.6784 0.7843 1.0000
effect_type = none
effect_color = 0.0000 0.9020 0.4627 1.0000
maximized_borders = true
maximized_shadows = true
button_layout = :minimize,maximize,close
left_button_spacing = 5
right_button_spacing = 5
ignore_views = app_id is "okay-panel" | app_id is "okay-desktop" | app_id is "okay-menu" | app_id is "okay-powermenu" | app_id is "okay-clipboard"

[autostart]
autostart_wf_shell = false
okay_autostart = sh -c 'if [ -x "$HOME/.config/okay-de/autostart" ]; then exec "$HOME/.config/okay-de/autostart"; elif [ -x /etc/xdg/okay-de/autostart ]; then exec /etc/xdg/okay-de/autostart; elif [ -x /usr/share/okay-de/defaults/okay-de/autostart ]; then exec /usr/share/okay-de/defaults/okay-de/autostart; fi'

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot

binding_launcher = <super> KEY_SPACE
command_launcher = okay-panel --toggle-menu

binding_settings = <super> KEY_I
command_settings = sh -c 'if [ -x "$HOME/.local/bin/okay-settings" ]; then exec "$HOME/.local/bin/okay-settings"; else exec okay-settings; fi'

binding_files = <super> KEY_E
command_files = pcmanfm

binding_clipboard = <super> KEY_V
command_clipboard = okay-clipboard

binding_lock = <super> KEY_L
command_lock = okay-lock

binding_powermenu = <super> <shift> KEY_E
command_powermenu = okay-powermenu

binding_screenshot = KEY_SYSRQ
command_screenshot = okay-screenshot

repeatable_binding_vol_up = KEY_VOLUMEUP
command_vol_up = okay-volume raise

repeatable_binding_vol_down = KEY_VOLUMEDOWN
command_vol_down = okay-volume lower

binding_vol_mute = KEY_MUTE
command_vol_mute = okay-volume mute

repeatable_binding_bri_up = KEY_BRIGHTNESSUP
command_bri_up = okay-brightness up

repeatable_binding_bri_down = KEY_BRIGHTNESSDOWN
command_bri_down = okay-brightness down

[wm-actions]
minimize = <super> KEY_DOWN
toggle_maximize = <super> KEY_UP

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[window-rules]
rule_panel = on created if app_id is "okay-panel" then set alpha 1.0
rule_desktop = on created if app_id is "okay-desktop" then set alpha 1.0
