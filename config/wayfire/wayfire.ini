# =============================================================================
# OKay DE — Konfiguracja kompozytora Wayfire (Wayland / wlroots)
# Architektura 60/120+ FPS, wymuszone dekoracje SSD oraz integracja z OKay Panel
# =============================================================================

[core]
# Zestaw wtyczek (plugins) kompozytora Wayfire:
# - alpha            : przezroczystość okien
# - animate          : płynne animacje otwierania/zamykania/minimalizacji (krzywe Beziera/circle)
# - autostart        : uruchamianie usług i komponentów sesji OKay DE
# - blur             : rozmycie tła (Kawase / Bokeh)
# - command          : skróty klawiszowe do aplikacji i usług systemowych
# - decoration       : dekoracje okien po stronie serwera (SSD: paski tytułowe i przyciski)
# - expo             : podgląd wszystkich pulpitów wirtualnych (Super+Tab)
# - fast-switcher    : szybkie przełączanie okien (Alt+Esc)
# - foreign-toplevel : komunikacja z paskiem zadań i przełącznikiem okien (okay-panel)
# - grid             : przyciąganie okien do krawędzi i połówek ekranu (Aero Snap)
# - gtk-shell        : integracja z aplikacjami GTK / GDK Wayland
# - idle             : zarządzanie wygaszaniem ekranu i blokadą sesji
# - move             : przesuwanie okien myszą (Super + LPM lub pasek tytułowy)
# - place            : inteligentne rozmieszczanie nowych okien (kaskada / centrowanie)
# - resize           : zmiana rozmiaru okien (Super + PPM lub krawędzie okna)
# - switcher         : graficzny przełącznik okien 3D/miniatury (Alt+Tab)
# - vswitch          : płynne przełączanie pulpitów wirtualnych ze sprężystą animacją
# - window-rules     : reguły automatycznej konfiguracji okien i przezroczystości
# - wm-actions       : zamykanie, maksymalizacja, pełny ekran, zawsze na wierzchu
# - wobbly           : opcjonalna fizyka sprężystych okien
# - xdg-activation   : przekazywanie fokusu między oknami i launcherem Wayland
plugins = alpha animate autostart blur command decoration expo fast-switcher foreign-toplevel grid gtk-shell idle move place resize switcher vswitch window-rules wm-actions wobbly xdg-activation

# Liczba wirtualnych pulpitów (3 w poziomie x 1 w pionie)
vwidth = 3
vheight = 1

# Wymuszenie dekoracji po stronie serwera (SSD) przez protokół xdg-decoration
preferred_decoration_mode = server

# Włączenie wsparcia XWayland dla starszych aplikacji X11 (Steam, Wine, starsze gry)
xwayland = true

# Domyślny kolor tła kompozytora zanim załaduje się swaybg (#0D0D11)
background_color = \#0D0D11FF

# Fokus przekazywany kliknięciem bez połykania kliknięcia przez kompozytor
focus_button_with_modifiers = false

# -----------------------------------------------------------------------------
# [autostart] — Automatyczne uruchamianie środowiska OKay DE
# -----------------------------------------------------------------------------
[autostart]
autostart_wf_shell = false
00_okay_autostart = ~/.config/okay-de/autostart

# -----------------------------------------------------------------------------
# [input] — Klawiatura, mysz i touchpad (libinput)
# -----------------------------------------------------------------------------
[input]
xkb_layout = pl
xkb_model = pc105
xkb_options =
xkb_rules = evdev
xkb_variant =

# Powtarzanie klawiszy (opóźnienie w ms / częstotliwość w Hz)
kb_repeat_delay = 300
kb_repeat_rate = 35

# Touchpad i mysz
tap_to_click = true
natural_scroll = false
disable_while_typing = true
middle_emulation = true
click_method = clickfinger
scroll_method = two-finger
mouse_accel_profile = default
touchpad_accel_profile = default
mouse_cursor_speed = 0.00
touchpad_cursor_speed = 0.00
mouse_scroll_speed = 1.0

# Motyw i rozmiar kursora
cursor_theme = Adwaita
cursor_size = 24

# -----------------------------------------------------------------------------
# [decoration] — Paski tytułowe i ramki okien po stronie serwera (SSD)
# -----------------------------------------------------------------------------
[decoration]
font = Inter 10
title_height = 30
border_size = 2
active_color = \#C9A0DCFF
inactive_color = \#1E1E28FF
ignore_views = none
button_order = minimize maximize close

# -----------------------------------------------------------------------------
# [pixdecor] — Zaokrąglenia rogów, cienie oraz styl przycisków (jeśli zainstalowano wayfire-plugins-extra)
# -----------------------------------------------------------------------------
[pixdecor]
border_size = 2
titlebar = true
maximized_borders = false
maximized_shadows = false
rounded_corner_radius = 12
fg_color = \#C9A0DCFF
bg_color = \#1E1E28FF
fg_text_color = \#F2F2F7FF
bg_text_color = \#9E9EAEFF
effect_type = none
overlay_engine = rounded_corners
always_decorate = (app_id is ".*")
ignore_views = (app_id is "okay-panel")
button_layout = :minimize,maximize,close
shadow_radius = 16
shadow_color = \#00000088

# -----------------------------------------------------------------------------
# [animate] — Silnik płynnych animacji 60/120+ FPS (krzywe Beziera / circle)
# -----------------------------------------------------------------------------
[animate]
open_animation = zoom
close_animation = zoom
minimize_animation = squeezimize
duration = 180ms circle
startup_duration = 260ms circle
fade_duration = 150ms circle
zoom_duration = 180ms circle
fire_duration = 220ms linear
squeezimize_duration = 160ms linear
random_fire_color = false
fire_color = \#C9A0DCFF

# -----------------------------------------------------------------------------
# [blur] — Rozmycie tła okien (Kawase Dual-Filter)
# -----------------------------------------------------------------------------
[blur]
mode = normal
method = kawase
kawase_offset = 2.0
kawase_degrade = 2
kawase_iterations = 2
saturation = 1.0
toggle = none

# -----------------------------------------------------------------------------
# [wobbly] — Sprężyste krzywe fizyki okien
# -----------------------------------------------------------------------------
[wobbly]
friction = 3.5
spring_k = 8.5
grid_resolution = 6

# -----------------------------------------------------------------------------
# [alpha] — Przezroczystość okien
# -----------------------------------------------------------------------------
[alpha]
min_value = 0.2
modifier = <alt> <super>

# -----------------------------------------------------------------------------
# [move] i [resize] — Przesuwanie i zmiana rozmiaru okien myszą
# -----------------------------------------------------------------------------
[move]
activate = <super> BTN_LEFT
enable_snap = true
enable_snap_off = true
snap_threshold = 12
snap_off_threshold = 12
workspace_switch_after = -1

[resize]
activate = <super> BTN_RIGHT

# -----------------------------------------------------------------------------
# [place] — Rozmieszczanie nowych okien
# -----------------------------------------------------------------------------
[place]
mode = center

# -----------------------------------------------------------------------------
# [wm-actions] — Akcje menedżera okien
# -----------------------------------------------------------------------------
[wm-actions]
toggle_fullscreen = <super> KEY_F11
toggle_maximize = <super> KEY_UP
minimize = <super> KEY_H
toggle_always_on_top = <super> KEY_T
toggle_showdesktop = <super> KEY_D
send_to_back = none

# -----------------------------------------------------------------------------
# [grid] — Przyciąganie okien do krawędzi i narożników ekranu (Aero Snap)
# -----------------------------------------------------------------------------
[grid]
duration = 160ms circle
restore = <super> KEY_DOWN | <super> KEY_KP0
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_c = <super> KEY_KP5
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3
slot_t = <super> KEY_KP8
slot_b = <super> KEY_KP2

# -----------------------------------------------------------------------------
# [switcher] i [fast-switcher] — Przełączanie okien (Alt+Tab / Alt+Esc)
# -----------------------------------------------------------------------------
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 180ms circle
view_thumbnail_scale = 0.28
view_thumbnail_rotation = 18

[fast-switcher]
activate = <alt> KEY_ESC
activate_backward = <alt> <shift> KEY_ESC
inactive_alpha = 0.78

# -----------------------------------------------------------------------------
# [vswitch] i [expo] — Przełączanie wirtualnych pulpitów
# -----------------------------------------------------------------------------
[vswitch]
binding_left = <ctrl> <alt> KEY_LEFT
binding_right = <ctrl> <alt> KEY_RIGHT
binding_up = <ctrl> <alt> KEY_UP
binding_down = <ctrl> <alt> KEY_DOWN
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
with_win_left = <ctrl> <alt> <shift> KEY_LEFT
with_win_right = <ctrl> <alt> <shift> KEY_RIGHT
with_win_up = <ctrl> <alt> <shift> KEY_UP
with_win_down = <ctrl> <alt> <shift> KEY_DOWN
with_win_1 = <super> <shift> KEY_1
with_win_2 = <super> <shift> KEY_2
with_win_3 = <super> <shift> KEY_3
with_win_4 = <super> <shift> KEY_4
duration = 180ms circle
gap = 20
wraparound = false

[expo]
toggle = <super> KEY_TAB
background = \#0D0D11FF
duration = 200ms circle
offset = 10
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4

# -----------------------------------------------------------------------------
# [window-rules] — Reguły okien dla spójności środowiska
# -----------------------------------------------------------------------------
[window-rules]
rule_panel_ignore = on created if app_id is "okay-panel" then set alpha 1.0
rule_settings_alpha = on created if app_id is "okay-settings" then set alpha 0.98

# -----------------------------------------------------------------------------
# [idle] — Zarządzanie bezczynnością ekranu
# -----------------------------------------------------------------------------
[idle]
toggle = none
screensaver_timeout = 600
dpms_timeout = 900
disable_on_fullscreen = true

# -----------------------------------------------------------------------------
# [command] — Skróty klawiszowych aplikacji, multimediów i zrzutów ekranu
# -----------------------------------------------------------------------------
[command]
# Zamykanie aktywnego okna (Alt+F4 oraz Super+Q)
binding_close = <alt> KEY_F4 | <super> KEY_Q
command_close = sh -c 'kill -TERM $(swaymsg -t get_tree 2>/dev/null | jq -r ".. | select(.focused? == true).pid" 2>/dev/null) 2>/dev/null || wtype -M alt -k F4 2>/dev/null || true'

# Menu aplikacji (Rofi / Wofi) pod Super+Space oraz samym klawiszem Super (Left Meta)
binding_launcher = <super> KEY_SPACE | KEY_LEFTMETA
command_launcher = sh -c 'if command -v rofi >/dev/null 2>&1; then rofi -show drun -show-icons; elif command -v wofi >/dev/null 2>&1; then wofi --show drun --allow-images; fi'

# Terminal (Super+Return oraz Ctrl+Alt+T)
binding_terminal = <super> KEY_ENTER | <ctrl> <alt> KEY_T
command_terminal = sh -c 'for term in foot kitty alacritty wezterm xfce4-terminal gnome-terminal konsole xterm; do if command -v "$term" >/dev/null 2>&1; then exec "$term"; fi; done'

# Menedżer plików (Super+E)
binding_files = <super> KEY_E
command_files = sh -c 'for fm in thunar pcmanfm nemo nautilus dolphin; do if command -v "$fm" >/dev/null 2>&1; then exec "$fm"; fi; done'

# Ustawienia systemowe OKay DE (Super+I)
binding_settings = <super> KEY_I
command_settings = okay-settings

# Blokada ekranu (Super+L)
binding_lock = <super> KEY_L
command_lock = okay-lock

# Wyjście z sesji Wayfire (Ctrl+Alt+Delete)
binding_logout = <ctrl> <alt> KEY_DELETE
command_logout = sh -c 'pkill -TERM -x wayfire'

# Zrzuty ekranu (PrintScreen = wycinek, Shift+PrintScreen = pełny ekran)
binding_screenshot_area = KEY_SYSRQ | KEY_PRINT
command_screenshot_area = okay-screenshot --area

binding_screenshot_full = <shift> KEY_SYSRQ | <shift> KEY_PRINT
command_screenshot_full = okay-screenshot --full

# Historia schowka (Super+V)
binding_clipboard = <super> KEY_V
command_clipboard = sh -c 'if command -v cliphist >/dev/null 2>&1 && command -v wl-copy >/dev/null 2>&1; then if command -v rofi >/dev/null 2>&1; then cliphist list | rofi -dmenu -p "Schowek" | cliphist decode | wl-copy; elif command -v wofi >/dev/null 2>&1; then cliphist list | wofi --dmenu -p "Schowek" | cliphist decode | wl-copy; fi; fi'

# Klawisze multimedialne — Głośność (WirePlumber / wpctl)
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

binding_volume_mute = KEY_MUTE
command_volume_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

binding_mic_mute = KEY_F20
command_mic_mute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Klawisze multimedialne — Jasność ekranu (brightnessctl)
repeatable_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = brightnessctl set +5%

repeatable_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = brightnessctl set 5%-

# Sterowanie odtwarzaczem (playerctl)
binding_media_play = KEY_PLAYPAUSE
command_media_play = playerctl play-pause

binding_media_next = KEY_NEXTSONG
command_media_next = playerctl next

binding_media_prev = KEY_PREVIOUSSONG
command_media_prev = playerctl previous
