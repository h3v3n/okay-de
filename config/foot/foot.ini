# OKay DE - Konfiguracja emulatora terminala foot

[main]
font=JetBrains Mono:size=11
pad=8x8
term=foot

[colors]
alpha=0.95
background=1e1e2e
foreground=cdd6f4

## Kolory standardowe (ANSI 0-7)
regular0=45475a # Czerń / Surface 1
regular1=f38ba8 # Czerwień
regular2=a6e3a1 # Zieleń
regular3=f9e2af # Żółć
regular4=89b4fa # Niebieski / Akcent
regular5=f5c2e7 # Magenta / Róż
regular6=94e2d5 # Cyjan / Morski
regular7=bac2de # Biel / Subtext 1

## Kolory jasne (ANSI 8-15)
bright0=585b70 # Ciemnoszary / Surface 2
bright1=f38ba8 # Jasnoczerwony
bright2=a6e3a1 # Jasnozielony
bright3=f9e2af # Jasnożółty
bright4=89b4fa # Jasnoniebieski
bright5=f5c2e7 # Jasnoróżowy
bright6=94e2d5 # Jasnocyjan
bright7=a6adc8 # Jasnobiały / Subtext 0

## Zaznaczenie
selection-foreground=cdd6f4
selection-background=313244
