[package]
name = "okay-de"
version = "0.1.0"
edition = "2021"
authors = ["OKay DE Contributors"]
description = "Standalone Wayland Desktop Environment compositor built on Smithay (DRM/KMS + GBM + EGL/GLES + libinput)"
license = "GPL-3.0-or-later"
repository = "https://github.com/h3v3n/okay-de"

[[bin]]
name = "okay-de"
path = "src/main.rs"

[dependencies]
calloop = { version = "0.14", features = ["executor"] }
libc = "0.2"
png = "0.17"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
